name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Review every PR regardless of author,
            including PRs generated by coding agents (Cursor, Claude, etc.).

            Use `gh pr view` and `gh pr diff` to read the PR. If a CLAUDE.md
            exists in the repo root or in directories touched by the PR, check
            the changes against its rules.

            Only flag HIGH SIGNAL issues found in the changed code:
            - Code that will fail to compile, parse, or fatally error
            - Clear logic errors that produce wrong results
            - Security issues (injection, XSS, missing capability checks or
              nonce verification, unescaped output in WordPress code)
            - Unambiguous violations of a CLAUDE.md rule (quote the rule)

            Do NOT flag style preferences, speculative issues that depend on
            unlikely inputs, or subjective improvements. If you are not
            confident an issue is real, do not flag it.

            For each confirmed issue, post one inline comment with
            mcp__github_inline_comment__create_inline_comment — a brief
            description and, for small self-contained fixes, a committable
            suggestion block. Never post duplicate comments for the same issue.

            If no issues are found, post a single short summary comment with
            `gh pr comment` stating the review found no issues and what was
            checked.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
